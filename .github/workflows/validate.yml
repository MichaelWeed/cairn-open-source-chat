name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.30"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.15"

      - name: Provision checksum-verified osv-scanner
        run: |
          OSV_SCANNER_VERSION=2.4.0
          OSV_SCANNER_SHA256=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          artifact="$RUNNER_TEMP/osv-scanner"
          install_dir="$RUNNER_TEMP/bin"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --output "$artifact" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          printf '%s  %s\n' "$OSV_SCANNER_SHA256" "$artifact" | sha256sum --check --strict
          install -m 0755 "$artifact" "$install_dir/osv-scanner"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/osv-scanner" --version

      - name: Provision checksum-verified grype
        run: |
          GRYPE_VERSION=0.115.0
          GRYPE_SHA256=3fad92940650e514c0aa2dad83526942a055e210cec09a8a59d9c024adc2b90e
          archive="$RUNNER_TEMP/grype.tar.gz"
          unpack_dir="$RUNNER_TEMP/grype"
          install_dir="$RUNNER_TEMP/bin"
          mkdir -p "$unpack_dir" "$install_dir"
          curl --fail --location --silent --show-error --output "$archive" "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GRYPE_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$unpack_dir"
          install -m 0755 "$unpack_dir/grype" "$install_dir/grype"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/grype" --version

      - name: Install pinned cyclonedx-py
        run: |
          uv tool install --python 3.13.15 cyclonedx-bom==7.3.0
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          cyclonedx-py --version

      - name: make validate
        run: make validate
