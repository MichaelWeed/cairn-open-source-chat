[project]
name = "cairn-backend"
version = "0.0.0"
description = "Cairn support-chat backend"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "mypy==1.18.2",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Pin transitive deps that would otherwise resolve to a version inside the
# 14-day dependency cooldown window (MASTER_PLAN.md §4).
constraint-dependencies = ["typing-extensions==4.15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
