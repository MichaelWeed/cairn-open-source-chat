[project]
name = "cairn-backend"
version = "0.0.0"
description = "Cairn support-chat backend"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.138.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf==6.18.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
gemini = ["google-genai==2.16.0"]
firestore = ["google-cloud-firestore==2.29.0"]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "mypy==1.18.2",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "types-pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# Pin transitive deps that would otherwise resolve to a version inside the
# 14-day dependency cooldown window.
constraint-dependencies = [
    "google-api-core==2.34.0",
    "google-auth==2.57.0",
    "googleapis-common-protos==1.75.1",
    "grpcio==1.83.0",
    "grpcio-status==1.83.0",
    "protobuf==7.35.1",
    "typing-extensions==4.15.0",
    "websockets==16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
