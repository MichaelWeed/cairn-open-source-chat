[project]
name = "cairn-backend"
version = "0.0.0"
description = "Cairn support-chat backend"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi==0.138.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]==0.49.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "mypy==1.18.2",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "types-pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# Pin transitive deps that would otherwise resolve to a version inside the
# 14-day dependency cooldown window (MASTER_PLAN.md §4).
constraint-dependencies = [
    "typing-extensions==4.15.0",
    "websockets==16.0",
    "aiohappyeyeballs==2.6.2",
    "build==1.5.0",
    "charset-normalizer==3.4.7",
    "filelock==3.29.4",
    "grpcio==1.81.1",
    "huggingface-hub==1.21.0",
    "numpy==2.5.0",
    "rpds-py==2026.5.1",
    "tqdm==4.68.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
