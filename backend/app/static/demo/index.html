<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cairn demo</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1b1e1a;
    --fg-muted: #6b7268;
    --bg: #f7f6f2;
    --card: #ffffff;
    --border: #e2ded4;
    --accent: #3e6b4f;
    --accent-fg: #f4faf6;
    --assistant-bg: #eef1ec;
    --error: #b3261e;
    --error-bg: #fdecea;
    --focus: #3e6b4f;
    --shadow: 0 1px 2px rgba(20, 24, 20, 0.06), 0 8px 24px rgba(20, 24, 20, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #eceeea;
      --fg-muted: #9aa39a;
      --bg: #14161a;
      --card: #1b1e22;
      --border: #2c3036;
      --accent: #5fb582;
      --accent-fg: #0d1510;
      --assistant-bg: #23272c;
      --error: #ff8a80;
      --error-bg: #2c1918;
      --focus: #5fb582;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1rem 3rem;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.5;
  }
  header { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.25rem; }
  .mark { flex: none; color: var(--accent); }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
  .tagline { color: var(--fg-muted); margin: 0 0 1.5rem; font-size: 0.92rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  #log {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    padding: 1.25rem;
    min-height: 220px;
    max-height: 55vh;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  #log:empty::before {
    content: "Ask about anything in the ingested corpus \2014 answers are grounded and cited.";
    color: var(--fg-muted);
    font-size: 0.9rem;
  }
  .row { display: flex; flex-direction: column; max-width: 84%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.assistant { align-self: flex-start; align-items: flex-start; }
  .role-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--fg-muted);
    margin: 0 0.15rem 0.3rem;
  }
  .bubble {
    padding: 0.6rem 0.9rem;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble { background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
  .row.assistant .bubble { background: var(--assistant-bg); border-bottom-left-radius: 4px; }
  .row.assistant .bubble:empty::after {
    content: "";
    display: inline-block;
    width: 0.4em; height: 0.4em;
    border-radius: 50%;
    background: var(--fg-muted);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
  .status {
    color: var(--fg-muted);
    font-size: 0.78rem;
    margin: 0.35rem 0.15rem 0;
    min-height: 1em;
  }
  .citations { margin: 0.5rem 0.15rem 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .citations:empty { margin: 0; }
  .citations a, .citations span {
    font-size: 0.76rem;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.2rem 0.65rem;
    text-decoration: none;
    display: inline-block;
  }
  .citations a:hover, .citations a:focus-visible { border-color: var(--accent); color: var(--accent); }
  .row.error .bubble {
    background: var(--error-bg);
    color: var(--error);
    border: 1px solid color-mix(in srgb, var(--error) 35%, transparent);
    border-bottom-left-radius: 4px;
  }
  form { display: flex; gap: 0.6rem; padding: 0.9rem; border-top: 1px solid var(--border); }
  input[type=text] {
    flex: 1;
    padding: 0.65rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 0.95rem;
  }
  input[type=text]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  button {
    flex: none;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  footer { color: var(--fg-muted); font-size: 0.78rem; margin-top: 1rem; }
  footer code { font-size: 0.9em; }
</style>
</head>
<body>
<header>
  <svg class="mark" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="7" y="15" width="10" height="4" rx="1.2" fill="currentColor"/>
    <rect x="8.5" y="9.5" width="7" height="4" rx="1.2" fill="currentColor" opacity="0.75"/>
    <rect x="10" y="4" width="4" height="4" rx="1.2" fill="currentColor" opacity="0.55"/>
  </svg>
  <h1>Cairn</h1>
</header>
<p class="tagline">Live demo &mdash; cited answers, grounded in your ingested corpus. Refuses rather than guesses.</p>

<div class="card">
  <div id="log" role="log" aria-live="polite"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask something" autocomplete="off" required aria-label="Message" />
    <button type="submit" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
</div>

<footer>This preview exercises the real chat API directly. The embeddable production widget ships separately.</footer>

<script>
(function () {
  const SESSION_KEY = "cairn_demo_session_id";
  const sessionId = sessionStorage.getItem(SESSION_KEY) ?? crypto.randomUUID();
  sessionStorage.setItem(SESSION_KEY, sessionId);

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");

  // Keeps the newest content in view two ways at once: the log panel's own
  // scrollbar (for when a single card taller than 55vh is scrolling
  // internally) and the outer page (for when the whole card — header,
  // history, and the input — is taller than the viewport, which the log's
  // own scrollTop can't fix since that's a different scroll container).
  function scrollToLatest() {
    log.scrollTop = log.scrollHeight;
    form.scrollIntoView({ block: "end", behavior: "instant" });
  }

  function appendRow(role, label) {
    const row = document.createElement("div");
    row.className = `row ${role}`;
    if (label) {
      const roleLabel = document.createElement("div");
      roleLabel.className = "role-label";
      roleLabel.textContent = label;
      row.appendChild(roleLabel);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    row.appendChild(bubble);
    log.appendChild(row);
    scrollToLatest();
    return { row, bubble };
  }

  function appendUserMessage(text) {
    const { bubble } = appendRow("user", "You");
    bubble.textContent = text;
  }

  function appendError(text) {
    const { bubble } = appendRow("error", "Error");
    bubble.textContent = text;
  }

  function appendAssistantTurn() {
    const { row, bubble } = appendRow("assistant", "Cairn");
    const citationsDiv = document.createElement("div");
    citationsDiv.className = "citations";
    row.appendChild(citationsDiv);
    const statusDiv = document.createElement("div");
    statusDiv.className = "status";
    row.appendChild(statusDiv);
    return { row, assistantDiv: bubble, citationsDiv, statusDiv };
  }

  function parseSseBlock(block) {
    let eventType = "message";
    const dataLines = [];
    for (const line of block.split("\n")) {
      if (line.startsWith("event: ")) eventType = line.slice("event: ".length);
      else if (line.startsWith("data: ")) dataLines.push(line.slice("data: ".length));
    }
    return { eventType, data: dataLines.join("\n") };
  }

  async function sendMessage(message) {
    appendUserMessage(message);
    const { row, assistantDiv, citationsDiv, statusDiv } = appendAssistantTurn();

    let response;
    try {
      response = await fetch("/api/v1/chat/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message, history: [] }),
      });
    } catch (err) {
      // The empty assistant bubble's pulsing "typing" dot (see the
      // :empty::after rule) would otherwise animate forever -- nothing
      // ever fills or removes it once fetch itself throws. Raw error
      // detail goes to the console, not the chat transcript: a customer
      // shouldn't see "TypeError: Failed to fetch".
      console.error("Cairn demo: request failed before a response arrived", err);
      row.remove();
      appendError("Couldn't reach the server. Check your connection and try again.");
      return;
    }

    if (!response.ok || !response.body) {
      console.error(`Cairn demo: request failed with HTTP ${response.status}`);
      row.remove();
      appendError("Something went wrong on our end. Please try again.");
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          if (!block.trim()) continue;

          const { eventType, data } = parseSseBlock(block);
          const payload = data ? JSON.parse(data) : {};

          if (eventType === "status") {
            statusDiv.textContent = payload.label ?? "";
          } else if (eventType === "chunk") {
            assistantDiv.textContent += payload.delta ?? "";
            scrollToLatest();
          } else if (eventType === "citations") {
            const sources = payload.sources ?? [];
            citationsDiv.textContent = "";
            sources.forEach((source) => {
              // Uploaded documents have no hosted URL yet (see
              // retrieval.py's build_citations) — only render a clickable
              // link once there's somewhere real to send the user;
              // otherwise show the same chip as an inert badge instead of
              // a link that silently fails to navigate.
              const isNavigable = /^https?:\/\//.test(source.url ?? "");
              const chip = document.createElement(isNavigable ? "a" : "span");
              if (isNavigable) chip.href = source.url;
              chip.textContent = source.title;
              citationsDiv.append(chip);
            });
            scrollToLatest();
          } else if (eventType === "error") {
            statusDiv.textContent = "";
            appendError(`${payload.code}: ${payload.message}`);
          } else if (eventType === "done") {
            statusDiv.textContent = "";
          }
          // "ping" carries no payload worth rendering.
        }
      }
    } catch (err) {
      // A dropped connection mid-stream (server restart, network blip)
      // otherwise leaves the UI stuck forever: the status text frozen on
      // whatever it last said ("Generating a reply") and, if no chunk had
      // arrived yet, the bubble's pulsing "typing" dot animating with
      // nothing coming and no error shown at all — confirmed live by
      // killing the server mid-response. Clean up instead.
      console.error("Cairn demo: stream interrupted", err);
      statusDiv.textContent = "";
      if (!assistantDiv.textContent.trim()) {
        // No answer text ever arrived -- citations without the answer
        // they support aren't useful on their own, and leaving the
        // empty bubble in place means only its pulsing dot, with no
        // explanation of why it never resolved.
        row.remove();
      }
      appendError("The connection was interrupted. Please try again.");
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    sendMessage(message);
  });
})();
</script>
</body>
</html>
