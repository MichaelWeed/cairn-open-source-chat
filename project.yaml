# Cairn — stable project identity and system associations.
#
# This file is the durable answer to "what is this, who owns it, and what
# external systems is it wired to." It changes rarely. Anything that
# changes per task belongs in the issue tracker, not here.
#
# Narrative context: docs/PROJECT-BRIEF.md
# Technical shape:   docs/ARCHITECTURE.md

identity:
  name: Cairn
  slug: cairn
  former_names:
    - AetherChat        # original working name, dropped 2026-07-13
    - Open-Source Chat  # placeholder title before naming
  tagline: >-
    Self-hosted support chat that answers from your own documents,
    cites every claim, and refuses when it isn't grounded.
  owner: Michael Weed
  license: Apache-2.0

status:
  admission: active
  since: 2026-08-21
  cadence: intermittent
  # "Intermittent" is a first-class property, not a caveat: work happens in
  # bursts with multi-week gaps. Every artifact in this repo is written to
  # be resumable cold, by someone with no memory of the last session.
  review_on: >-
    Re-run the admission review if six months pass with no commits.

classification:
  kind: open-source-plus-commercial
  # The software is genuinely free and Apache-2.0 licensed with no paid
  # tier, no per-seat fee, and no hosted upsell. It is also the author's
  # public work sample, and out-of-scope requests are routed to paid
  # consulting. Both are true; neither compromises the other.
  paid_offering: none
  commercial_motive: consulting-engagement-funnel
  commercial_motive_visibility: private
  # Deliberate: the product is meant to persuade on its own merits. The
  # funnel rationale lives in the author's private planning notes, not in
  # published documentation.

exposure:
  current: public-source-only
  # The source is public. No deployment exists, and the author operates no
  # running service; any live deployment belongs to a third-party operator.
  intended: self-hosted-by-third-parties
  # The delivery model is source and container images that other operators
  # run inside their own infrastructure. There is no service the author
  # hosts, and therefore no production environment the author operates.
  author_hosted_services: none
  network_listener: none

data:
  # What a running deployment touches. See docs/PRIVACY.md for the full table.
  chat_messages:
    persisted: false
    note: Passed through rate limiter, retrieval, and provider, then discarded.
  conversation_history:
    persisted: false
    note: >-
      API accepts bounded history; the demo sends no prior turns, while the generic
      widget keeps up to five turns in memory. The server persists none.
  knowledge_corpus:
    persisted: true
    note: >-
      Operator-supplied documents. Chunk text and embeddings in the local SQLite
      flat index; per-document metadata in SQLite. Legacy Chroma files are not read.
  credentials_handled:
    - name: ADMIN_BOOTSTRAP_PASSWORD
      status: not-implemented
      note: Reserved env var. No admin surface exists yet, so nothing consumes it.
  secrets_in_repository: none
  third_party_data_egress:
    default: none
    condition: >-
      Ollama is the only implemented real provider. Hosted-provider egress is
      planned and is not currently available.

integrations:
  outbound:
    - name: Ollama
      required: true
      note: Local model inference and embeddings. Configured via OLLAMA_BASE_URL.
  inbound: none

systems:
  source:
    provider: github
    repository: MichaelWeed/cairn-open-source-chat
    url: https://github.com/MichaelWeed/cairn-open-source-chat
    visibility: public
    state: published
    initial_publication:
      ref: refs/heads/main
      head_sha: 04a1db5d72884eb8fbf803ab46686ccc58d3a9b6
      published_on: "2026-08-22"
    note: >-
      Public source is published. initial_publication records the immutable first
      main push on 2026-08-22; it is not a current remote-ref pointer. This is
      source availability only; the author operates no hosted Cairn service.
  ci:
    provider: github-actions
    workflow: .github/workflows/validate.yml
    state: active-green
    first_successful_run:
      id: "32605367945"
      head_sha: ab1668696acc60ca7a696f6f738bb9425d1eb3ea
      completed_on: "2026-08-22"
      url: https://github.com/MichaelWeed/cairn-open-source-chat/actions/runs/32605367945
    note: >-
      Runs the same `make validate` as the local pre-push hook. first_successful_run
      records immutable first-publication evidence, not the latest workflow run.
  issue_tracking:
    provider: github-issues
    state: enabled-empty
    note: >-
      GitHub Issues is enabled, but no issue, milestone, or work object exists.
      Chosen 2026-08-21 over Jira. It exports cleanly via API if a Jira-shaped
      tracker is ever wanted again.
  project_board:
    provider: github-projects
    state: not-yet-created
    note: GitHub Projects is enabled, but no project board or work object exists.
  jira:
    state: none
    note: A Jira instance previously existed and was deactivated. Not being reinstated.

documentation_authority:
  # Where each kind of documentation is authoritative. A fact should live in
  # exactly one of these and be referenced from the others.
  public_technical:
    location: this repository
    files:
      - README.md                 # executive pitch; outcome first
      - DEVELOPER_README.md       # deploy, operate, extend; API contract
      - docs/ARCHITECTURE.md      # system shape and why it is that shape
      - docs/adr/                 # architectural decisions already made
      - docs/SECURITY.md          # built-and-tested vs not-yet-built
      - docs/PRIVACY.md           # what data exists and where
      - docs/DEPENDENCIES.md      # per-dependency justification
      - docs/QA_CHECKLIST.md      # manual verification and its honest status
  project_state:
    location: this repository
    files:
      - project.yaml              # this file
      - docs/PROJECT-BRIEF.md     # why it exists, for whom, current state
      - docs/PUBLIC-AVAILABILITY.md  # delivered publication record and D4 decision
  work_tracking:
    location: GitHub Issues and Projects
    state: features-enabled-empty
    note: >-
      The features are enabled, but no issue, milestone, or project board exists.
      D4 remains open: choose whether future work migrates fully to GitHub work
      objects or only milestone work does. docs/PUBLIC-AVAILABILITY.md remains a
      delivered publication record, not an active tracker.
  private_planning:
    location: author's private notes, outside this repository
    contains:
      - commercial and consulting-funnel strategy
      - trademark screening status and fallback names
      - phase sequencing and long-range plan
    note: >-
      Private planning is intentionally outside this repository and excluded
      from the public publication branch.

scope:
  in_scope:
    - Grounded, cited answers over an operator-supplied document corpus
    - Refusal when retrieval confidence is low
    - Local-model-first inference, self-hosted, single-tenant
    - An embeddable widget for a third-party page
    - Order-status deep links and clean human escalation
  out_of_scope:
    # Closed by policy, not re-argued per request.
    - CRM synchronization
    - Auth-aware or per-user personalized answers
    - Multi-tenancy within a single deployment
    - Voice
