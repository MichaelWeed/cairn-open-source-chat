# Compose Specification only — no Docker-specific extensions — so this
# runs unmodified under `docker compose` or `podman compose`/`podman-compose`.
# See DEVELOPER_README.md §2.
#
# `name` is pinned rather than left to the checkout-directory default:
# `make image-scan` looks up the built image as `cairn-backend:latest`,
# and Compose otherwise derives that prefix from the current directory's
# basename — which is `cairn` on a fresh clone but not in a git worktree
# (e.g. `.claude/worktrees/<branch>`) or GitHub Actions' checkout dir
# (`cairn-open-source-chat`, per the remote). Pinning it keeps the image
# tag — and therefore the validate gate — independent of where the repo
# happens to be checked out.
name: cairn
services:
  backend:
    build:
      context: ./backend
      args:
        CAIRN_INSTALL_GEMINI: ${CAIRN_INSTALL_GEMINI:-false}
        CAIRN_INSTALL_FIRESTORE: ${CAIRN_INSTALL_FIRESTORE:-false}
    ports:
      # Host port is CAIRN_PORT (set it in .env if 8080 is taken on your
      # machine — `make up` preflights it and says so). The port stays
      # fixed and operator-chosen, never auto-selected: the embed snippet,
      # CORS allowlist, and any reverse proxy in front all reference it.
      - "${CAIRN_PORT:-8080}:8000"
    environment:
      # Compose only interpolates .env into THIS file — it does not pass
      # .env to the container by itself. Every operator knob in
      # .env.example is therefore forwarded explicitly here; defaults
      # mirror backend/app/config.py.
      CAIRN_PORT: ${CAIRN_PORT:-8080}
      # Empty means "allow only the app's own origin" (derived from
      # CAIRN_PORT in config.py); set it when embedding on other sites.
      ORIGIN_ALLOWLIST: ${ORIGIN_ALLOWLIST:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b-instruct}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-development}
      PROVIDER: ${PROVIDER:-echo}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30.0}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-1}
      SYSTEM_INSTRUCTION: ${SYSTEM_INSTRUCTION:-}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1500}
      MAX_OUTPUT_CHARS: ${MAX_OUTPUT_CHARS:-6000}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-4}
      RETRIEVAL_MAX_DISTANCE: ${RETRIEVAL_MAX_DISTANCE:-1.2}
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-local}
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-}
      FIRESTORE_CORPUS_ID: ${FIRESTORE_CORPUS_ID:-}
      FIRESTORE_CORPUS_VERSION: ${FIRESTORE_CORPUS_VERSION:-}
      FIRESTORE_EMBEDDING_IDENTITY: ${FIRESTORE_EMBEDDING_IDENTITY:-}
      FIRESTORE_EMBEDDING_DIMENSIONS: ${FIRESTORE_EMBEDDING_DIMENSIONS:-}
      FIRESTORE_DISTANCE_MEASURE: ${FIRESTORE_DISTANCE_MEASURE:-}
      FIRESTORE_MAX_DISTANCE: ${FIRESTORE_MAX_DISTANCE:-}
      FIRESTORE_QUERY_TIMEOUT_SECONDS: ${FIRESTORE_QUERY_TIMEOUT_SECONDS:-}
      FIRESTORE_MAX_RETRIES: ${FIRESTORE_MAX_RETRIES:-}
      CHAT_MESSAGE_MAX_CHARS: ${CHAT_MESSAGE_MAX_CHARS:-500}
      RATE_LIMIT_IP_CAPACITY: ${RATE_LIMIT_IP_CAPACITY:-20}
      RATE_LIMIT_IP_REFILL_PER_MINUTE: ${RATE_LIMIT_IP_REFILL_PER_MINUTE:-20}
      RATE_LIMIT_SESSION_CAPACITY: ${RATE_LIMIT_SESSION_CAPACITY:-10}
      RATE_LIMIT_SESSION_REFILL_PER_MINUTE: ${RATE_LIMIT_SESSION_REFILL_PER_MINUTE:-10}
      PUBLIC_ENDPOINT_CONTROLS_ENABLED: ${PUBLIC_ENDPOINT_CONTROLS_ENABLED:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      PUBLIC_CONTROL_DIGEST_KEY: ${PUBLIC_CONTROL_DIGEST_KEY:-}
      PUBLIC_RATE_IP_CAPACITY: ${PUBLIC_RATE_IP_CAPACITY:-}
      PUBLIC_RATE_IP_REFILL_PER_MINUTE: ${PUBLIC_RATE_IP_REFILL_PER_MINUTE:-}
      PUBLIC_RATE_SESSION_CAPACITY: ${PUBLIC_RATE_SESSION_CAPACITY:-}
      PUBLIC_RATE_SESSION_REFILL_PER_MINUTE: ${PUBLIC_RATE_SESSION_REFILL_PER_MINUTE:-}
      PUBLIC_RATE_STATE_TTL_SECONDS: ${PUBLIC_RATE_STATE_TTL_SECONDS:-}
      PUBLIC_CONTROL_MAX_KEYS: ${PUBLIC_CONTROL_MAX_KEYS:-}
      PUBLIC_MAX_ACTIVE_REQUESTS: ${PUBLIC_MAX_ACTIVE_REQUESTS:-}
      PUBLIC_MAX_QUEUED_REQUESTS: ${PUBLIC_MAX_QUEUED_REQUESTS:-}
      PUBLIC_QUEUE_WAIT_SECONDS: ${PUBLIC_QUEUE_WAIT_SECONDS:-}
      PUBLIC_LEASE_TTL_SECONDS: ${PUBLIC_LEASE_TTL_SECONDS:-}
      PUBLIC_LEASE_RENEW_SECONDS: ${PUBLIC_LEASE_RENEW_SECONDS:-}
      PUBLIC_BUDGET_CURRENCY: ${PUBLIC_BUDGET_CURRENCY:-}
      PUBLIC_BUDGET_HOURLY: ${PUBLIC_BUDGET_HOURLY:-}
      PUBLIC_BUDGET_DAILY: ${PUBLIC_BUDGET_DAILY:-}
      PUBLIC_BUDGET_RESERVE_PER_ATTEMPT: ${PUBLIC_BUDGET_RESERVE_PER_ATTEMPT:-}
    volumes:
      - cairn_data:/data
    depends_on:
      - ollama

  ollama:
    image: docker.io/ollama/ollama@sha256:509fdf54e23bd50d87af646cb51c0a7a203d6a83cc4d6695b3b08c5be1c62c0a
    volumes:
      - ollama_data:/root/.ollama

volumes:
  cairn_data:
  ollama_data:
